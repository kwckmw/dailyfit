    // ==========================================
    // 4. 날씨 조건 기반 동적 조합 엔진
    // ==========================================
    function generateDynamicOutfit({ currentTemp, apparentTemp, maxTemp, minTemp, windSpeed, maxPrecipProb, sensitivityOffset, seed }) {
      // 1. 체감 기온 + 사용자 오프셋 + 강풍 냉각 산출
      let effectiveTemp = apparentTemp !== undefined ? apparentTemp : currentTemp;
      effectiveTemp += sensitivityOffset; // 예: 더위 타면 양수(+), 추위 타면 음수(-)

      if (windSpeed >= 4.5) {
        effectiveTemp -= (windSpeed - 4) * 0.45;
      }

      const tempRange = maxTemp - minTemp;
      const isLargeRange = tempRange >= 8;
      const isRainExpected = maxPrecipProb >= 40;
      const isWindy = windSpeed >= 4.5;

      // 2. 의사 난수 셔플 함수 (새로고침/재추첨 seed 기반)
      function getSeededRandom(offsetKey) {
        const x = Math.sin(seed * 9973 + offsetKey * 7919) * 10000;
        return x - Math.floor(x);
      }

      function pickRandom(arr, offsetKey) {
        if (!arr || arr.length === 0) return null;
        const idx = Math.floor(getSeededRandom(offsetKey) * arr.length);
        return arr[idx];
      }

      // 3. 상의 필터링 및 동적 선택
      const candidateTops = CLOTHING_DB.tops.filter(item => effectiveTemp >= item.minT && effectiveTemp <= item.maxT);
      const chosenTop = candidateTops.length > 0 
        ? pickRandom(candidateTops, 1) 
        : (effectiveTemp > 28 ? CLOTHING_DB.tops[0] : CLOTHING_DB.tops[CLOTHING_DB.tops.length - 1]);

      // 4. 하의 필터링 및 동적 선택 (비 예보 시 가중치)
      let candidateBottoms = CLOTHING_DB.bottoms.filter(item => effectiveTemp >= item.minT && effectiveTemp <= item.maxT);
      if (isRainExpected) {
        const rainFriendly = candidateBottoms.filter(b => b.rainyOk);
        if (rainFriendly.length > 0) candidateBottoms = rainFriendly;
      }
      const chosenBottom = candidateBottoms.length > 0 
        ? pickRandom(candidateBottoms, 2) 
        : (effectiveTemp > 28 ? CLOTHING_DB.bottoms[0] : CLOTHING_DB.bottoms[CLOTHING_DB.bottoms.length - 1]);

      // 5. 겉옷 필요성 및 필터링
      let needsOuter = effectiveTemp < 22 || (isLargeRange && effectiveTemp < 25) || isWindy;
      let candidateOuters = [];
      let chosenOuter = "겉옷 불필요";

      if (needsOuter) {
        candidateOuters = CLOTHING_DB.outers.filter(item => effectiveTemp >= item.minT && effectiveTemp <= item.maxT);
        
        // 바람이 강하면 방풍 겉옷 우선
        if (isWindy) {
          const windproofItems = candidateOuters.filter(o => o.windproof);
          if (windproofItems.length > 0) candidateOuters = windproofItems;
        }
        // 일교차 중심이면 들고 다니기 편한 아우터 우선
        else if (isLargeRange && effectiveTemp >= 16) {
          const portableItems = candidateOuters.filter(o => o.portable);
          if (portableItems.length > 0) candidateOuters = portableItems;
        }

        if (candidateOuters.length > 0) {
          chosenOuter = pickRandom(candidateOuters, 3).name;
        } else {
          // 기온이 매우 낮을 때 최후 패딩
          chosenOuter = effectiveTemp < 5 ? "두꺼운 롱패딩" : "가벼운 가디건 또는 바람막이";
        }
      }

      // 6. 소품 선택
      const candidateAccessories = CLOTHING_DB.accessories.filter(item => effectiveTemp >= item.minT && effectiveTemp <= item.maxT);
      const chosenAccessory = pickRandom(candidateAccessories, 4);

      // 7. 맞춤 스타일 무드 태그 생성
      const moodTags = [];
      if (chosenTop.style) moodTags.push(`#${chosenTop.style}`);
      if (isLargeRange) moodTags.push("#일교차대비_레이어드");
      if (isRainExpected) moodTags.push("#우천대비_쾌적룩");
      if (isWindy) moodTags.push("#방풍_보온");
      if (effectiveTemp >= 27) moodTags.push("#시원한_통기성");

      // 8. 동적 문구 및 추천 이유 합성
      const reasons = [];
      let summaryHeadline = "";

      if (effectiveTemp >= 28) {
        summaryHeadline = "무더운 기온이에요. 열 배출이 잘되는 시원한 조합을 추천합니다.";
        reasons.push("체감 온도가 높아 땀 배출과 통기성이 가장 중요합니다.");
      } else if (effectiveTemp >= 22) {
        summaryHeadline = "기분 좋은 쾌적한 온도예요. 가벼운 단품 차림으로 활동하기 좋습니다.";
        reasons.push("활동하기 편안한 두께감의 단품 상하의 조합입니다.");
      } else if (effectiveTemp >= 16) {
        summaryHeadline = "선선한 날씨입니다. 얇은 긴팔이나 가벼운 겉옷을 곁들이면 딱 맞아요.";
        reasons.push("그늘이나 실내외 기온차에 대비한 부담 없는 레이어드 조합입니다.");
      } else if (effectiveTemp >= 9) {
        summaryHeadline = "제법 쌀쌀한 공기예요. 체온을 지켜줄 든든한 겉옷을 걸치세요.";
        reasons.push("찬 공기가 스며들지 않도록 단열성과 착용감을 고려했습니다.");
      } else {
        summaryHeadline = "매서운 추위가 느껴져요. 여러 겹 레이어드와 방한 아우터로 단단히 무장하세요.";
        reasons.push("낮은 체감 온도와 한파를 방어하기 위해 보온 아이템을 집중 배치했습니다.");
      }

      if (isLargeRange) {
        reasons.push(`오늘 하루 일교차가 ${Math.round(tempRange)}°C로 커서 아침·저녁 탈착이 쉬운 겉옷이 유리합니다.`);
      }
      if (isWindy) {
        reasons.push(`풍속이 초속 ${Math.round(windSpeed)}m/s로 강해 체감 기온이 낮아지므로 찬바람 차단이 필요합니다.`);
      }
      if (isRainExpected) {
        reasons.push("비나 눈 예보가 있어 옷 밑단이 젖지 않는 조합과 우산 휴대를 권장합니다.");
      }
      if (Math.abs(sensitivityOffset) > 0) {
        const dir = sensitivityOffset > 0 ? "가볍고 시원한" : "보온성을 한 층 높인";
        reasons.push(`설정하신 체질 성향(${sensitivityOffset > 0 ? '+' : ''}${sensitivityOffset}°C)을 반영해 ${dir} 아이템으로 필터링했습니다.`);
      }

      return {
        summaryHeadline,
        top: chosenTop.name,
        bottom: chosenBottom.name,
        outer: chosenOuter,
        accessory: chosenAccessory ? chosenAccessory.name : null,
        reasons,
        moodTags,
        hasOuter: chosenOuter !== "겉옷 불필요",
        hasUmbrella: isRainExpected,
        effectiveTemp: Math.round(effectiveTemp),
        tempRange: Math.round(tempRange)
      };
    }

    // ==========================================
    // 5. React 메인 애플리케이션
    // ==========================================
    function App() {
      const [weatherData, setWeatherData] = useState(null);
      const [locationName, setLocationName] = useState("내 주변");
      const [coords, setCoords] = useState(null);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);

      // 실시간 조합 시드 (새로고침 또는 '다른 조합' 클릭 시 변경)
      const [outfitSeed, setOutfitSeed] = useState(() => Math.floor(Math.random() * 10000));

      // 체감 기온 오프셋 설정 (-4°C ~ +4°C, localStorage 저장)
      const [sensitivityOffset, setSensitivityOffset] = useState(() => {
        const saved = localStorage.getItem("user_sensitivity_offset");
        return saved !== null ? parseFloat(saved) : 0.0;
      });

      // 도시 검색 모달 상태
      const [searchModalOpen, setSearchModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const [isSearching, setIsSearching] = useState(false);

      const handleOffsetChange = (newOffset) => {
        setSensitivityOffset(newOffset);
        localStorage.setItem("user_sensitivity_offset", newOffset.toString());
        // 설정 변경 시 새로운 적합 조합 바로 산출
        setOutfitSeed(prev => prev + 1);
      };

      // 날씨 API 호출
      const loadWeather = useCallback(async (lat, lon, locName = "내 주변") => {
        setLoading(true);
        setErrorMsg(null);
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,wind_speed_10m&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=Asia%2FSeoul&forecast_days=2`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("날씨 정보를 서버에서 가져오지 못했습니다.");
          const data = await res.json();
          if (!data || !data.current || !data.hourly || !data.daily) {
            throw new Error("날씨 데이터 구조가 올바르지 않습니다.");
          }

          {searchModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[85vh] flex flex-col animate-in">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-base text-slate-900">지역 직접 선택</h3>
                  <button 
                    onClick={() => setSearchModalOpen(false)}
                    className="p-1 rounded-full text-slate-400 hover:text-slate-600 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <button
                  onClick={() => {
                    setSearchModalOpen(false);
                    initLocation();
                  }}
                  className="w-full py-2.5 px-3 bg-blue-50 text-blue-700 rounded-2xl text-xs font-bold flex items-center justify-center space-x-1.5 hover:bg-blue-100 transition"
                >
                  <span>🎯</span>
                  <span>현재 내 위치(GPS)로 날씨 확인하기</span>
                </button>

                <form onSubmit={handleSearchSubmit} className="flex gap-2">
                  <input 
                    type="text" 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="도시 또는 지역명 입력 (예: 강릉, 전주)"
                    className="flex-1 px-3.5 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <button 
                    type="submit" 
                    disabled={isSearching}
                    className="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800 transition disabled:opacity-50"
                  >
                    {isSearching ? '검색중' : '검색'}
                  </button>
                </form>

                <div className="flex-1 overflow-y-auto space-y-1.5 max-h-48 hide-scrollbar">
                  {searchResults.length > 0 ? (
                    searchResults.map((city, idx) => (
                      <button
                        key={idx}
                        onClick={() => selectCity(city)}
                        className="w-full text-left px-3.5 py-2.5 rounded-xl hover:bg-slate-100 text-xs flex justify-between items-center transition border border-slate-100"
                      >
                        <span className="font-bold text-slate-800">{city.name}</span>
                        <span className="text-[11px] text-slate-400">
                          {city.admin1 ? `${city.admin1}, ` : ''}{city.country || '대한민국'}
                        </span>
                      </button>
                    ))
                  ) : searchQuery && !isSearching ? (
                    <p className="text-center text-xs text-slate-400 py-4">검색 결과가 없습니다.</p>
                  ) : null}
                </div>

                <div>
                  <p className="text-[11px] font-bold text-slate-400 mb-2">주요 도시 바로가기</p>
                  <div className="flex flex-wrap gap-1.5">
                    {DEFAULT_CITIES.map((c, i) => (
                      <button
                        key={i}
                        onClick={() => selectCity(c)}
                        className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-xl font-bold transition"
                      >
                        {c.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="p-4 text-center text-slate-400 text-[11px] border-t border-slate-200/50 mt-auto">
            Open-Meteo Weather API 기반 • 한국 표준시(KST)
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
